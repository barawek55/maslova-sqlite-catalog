plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.student.maslovacatalog'
    compileSdk 37

    defaultConfig {
        applicationId 'ru.student.maslovacatalog'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
